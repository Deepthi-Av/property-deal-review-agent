[project]
name = "home-deal-review"
version = "0.1.0"
description = "A bounded, evidence-backed two-deal home-purchase review prototype."
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit>=1.50,<2",
    "langgraph>=1,<2",
    "langchain-openai==1.7.2",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

